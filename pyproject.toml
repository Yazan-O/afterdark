[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterdark"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "Pillow>=10", "numpy>=1.26", "meta_sam_parser"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
film = ["websocket-client>=1.8,<2", "matplotlib>=3.8,<4", "scipy>=1.11,<2"]

[tool.afterdark]
film-tools = ["Chrome", "FFmpeg"]

[tool.setuptools.packages.find]
include = ["afterdark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
